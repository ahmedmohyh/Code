# Irshad/PhySF setup using only ECG (no EDA, no EEG).
# 25 subjects, 128 Hz, binary labels derived from filename (flow / no_flow).
# Adjust dataset.path to the actual location of PhySF.zip on your machine.

experiment_name: "setup_08b_irshad_physf_ecg_only"
seed: 42

dataset:
  name: "Irshad_PhySF"
  path: "C:\\Users\\user\\Downloads\\Masterthesis\\dataset\\data\\PhySF.zip"
  modalities:
    - "ECG"

label:
  method: "filename"
  margin: 0.0
  items: "full_subscale"
  classes:
    - "no_flow"
    - "flow"

preprocessing:
  cleaning_package: "neurokit2"
  z_standardise: true
  outlier_strategy: "train_only"
  baseline_correction: "none"
  baseline_length_s: 60

segmentation:
  window_length_s: 60
  step_s: 30

features:
  ecg:
    time:
      - "hr_mean"
      - "SDNN"
      - "RMSSD"
      - "pNN50"
    frequency:
      - "VLF"
      - "LF"
      - "HF"
      - "LF_HF"
      - "TP"
    nonlinear:
      - "sample_entropy"
      - "DFA_alpha1"
      - "DFA_alpha2"
  eeg:
    bands:
      - "theta"
      - "alpha"
      - "beta"
  package: "neurokit2"

models:
  classical:
    - "RandomForest"
    - "SVM"
    - "kNN"
    - "LogisticRegression"
    - "XGBoost"
  deep:
    - "MLP"
    - "LSTM"
    - "CNN1D"

validation:
  strategy: "LOSO"
  permutation: true
  metrics:
    - "accuracy"
    - "f1_macro"
    - "precision_low"
    - "recall_low"
    - "precision_high"
    - "recall_high"
    - "auc"
    - "inference_ms"
