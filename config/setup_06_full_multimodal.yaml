# Setup 06: multimodal ECG + EDA + webcam affect features.
# Labels are one per subject from level 1 by default. Set score_column to a
# list and treat_levels_as_subjects: true to use pseudo-subjects.

experiment_name: "setup_06_full_multimodal"
seed: 42

dataset:
  name: "BIRAFFE2"
  path: "../dataset/data/BIRAFFE2/Version 2/BIRAFFE2-biosigs.zip"
  metadata_path: "../dataset/data/BIRAFFE2/Version 2/BIRAFFE2-metadata.csv"
  procedure_path: "../dataset/data/BIRAFFE2/Version 2/BIRAFFE2-procedure.zip"
  face_zip_path: "../dataset/data/BIRAFFE2/Version 2/BIRAFFE2-photo.zip"
  modalities:
    - "ECG"
    - "EDA"
    - "FACE"
  score_column:
    - "GEQ-1-FLOW-2018"
    - "GEQ-2-FLOW-2018"
    - "GEQ-3-FLOW-2018"
  treat_levels_as_subjects: true

label:
  method: "median_split"
  margin: 0.0
  items: "full_subscale"
  classes:
    - "low"
    - "high"

preprocessing:
  cleaning_package: "neurokit2"
  z_standardise: true
  outlier_strategy: "train_only"
  baseline_correction: "none"
  baseline_length_s: 60

segmentation:
  window_length_s: 60
  step_s: 30

features:
  ecg:
    time:
      - "hr_mean"
      - "SDNN"
      - "RMSSD"
      - "pNN50"
    frequency:
      - "VLF"
      - "LF"
      - "HF"
      - "LF_HF"
      - "TP"
    nonlinear:
      - "sample_entropy"
      - "DFA_alpha1"
      - "DFA_alpha2"
  package: "neurokit2"

models:
  classical:
    - "RandomForest"
  deep: []

validation:
  strategy: "LOSO"
  permutation: false
  metrics:
    - "accuracy"
    - "f1_macro"
    - "precision_low"
    - "recall_low"
    - "precision_high"
    - "recall_high"
    - "auc"
    - "inference_ms"
