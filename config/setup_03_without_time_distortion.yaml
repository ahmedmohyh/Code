# Setup 03: recompute the GEQ Flow score from the raw item responses, excluding
# item 25 ("I lost track of time"), and treat each of the three game levels as a
# separate pseudo-subject. This tests whether Time Distortion is helping or
# hurting physiological prediction while using time-varying labels.

experiment_name: "setup_03_without_time_distortion"
seed: 42

dataset:
  name: "BIRAFFE2"
  path: "../dataset/data/BIRAFFE2/Version 2/BIRAFFE2-biosigs.zip"
  metadata_path: "../dataset/data/BIRAFFE2/Version 2/BIRAFFE2-metadata.csv"
  procedure_path: "../dataset/data/BIRAFFE2/Version 2/BIRAFFE2-procedure.zip"
  modalities:
    - "ECG"
  # score_column is only used as a fallback to infer the GEQ level when
  # raw_geq_levels is not set. The actual label is recomputed from the raw CSVs.
  score_column: "GEQ-1-FLOW-2018"
  treat_levels_as_subjects: true
  raw_geq_dir: "../dataset/data/BIRAFFE2/Version 2"
  recompute_flow_from_items: true
  exclude_time_distortion: true
  raw_geq_levels: [1, 2, 3]

label:
  method: "median_split"
  margin: 0.0
  items: "without_time_distortion"
  classes:
    - "low"
    - "high"

preprocessing:
  cleaning_package: "neurokit2"
  z_standardise: true
  outlier_strategy: "train_only"
  baseline_correction: "none"
  baseline_length_s: 60

segmentation:
  window_length_s: 60
  step_s: 30

features:
  ecg:
    time:
      - "hr_mean"
      - "SDNN"
      - "RMSSD"
      - "pNN50"
    frequency:
      - "VLF"
      - "LF"
      - "HF"
      - "LF_HF"
      - "TP"
    nonlinear:
      - "sample_entropy"
      - "DFA_alpha1"
      - "DFA_alpha2"
  package: "neurokit2"

models:
  classical:
    - "RandomForest"
  deep: []

validation:
  strategy: "LOSO"
  permutation: false
  metrics:
    - "accuracy"
    - "f1_macro"
    - "precision_low"
    - "recall_low"
    - "precision_high"
    - "recall_high"
    - "auc"
    - "inference_ms"
