# YAML batch definition: re-run all previously executed setups with
# real per-level timestamps from BIRAFFE2-games.zip.
#
# Run with:
#   python scripts/run_batch_from_config.py --batch config/real_level_configs/batch_real_level_times_setups.yaml

batch_name: "real_level_times_all_ran_setups"
n_jobs: -1

configs:
  - "config/real_level_configs/setup_01_biraffe2_ecg_baseline_real_level_times.yaml"
  - "config/real_level_configs/setup_01_biraffe2_ecg_baseline_avg_levels_real_level_times.yaml"
  - "config/real_level_configs/setup_02_label_margin_01_real_level_times.yaml"
  - "config/real_level_configs/setup_04_no_zscore_real_level_times.yaml"
  - "config/real_level_configs/setup_05_no_outlier_real_level_times.yaml"
  - "config/real_level_configs/setup_07_5min_window_real_level_times.yaml"
  - "config/real_level_configs/setup_09_heartpy_real_level_times.yaml"
  - "config/real_level_configs/setup_01c_biraffe2_ecg_levels_as_subjects_real_level_times.yaml"
  - "config/real_level_configs/setup_01d_drop_unreliable_60s_features_real_level_times.yaml"
  - "config/real_level_configs/setup_01e_per_subject_normalization_real_level_times.yaml"
  - "config/real_level_configs/setup_01f_shorter_step_real_level_times.yaml"
  - "config/real_level_configs/setup_01g_levels_as_subjects_per_subject_norm_real_level_times.yaml"
