experiment_name: setup_06_full_multimodal_extreme_percentile
seed: 42
dataset:
  name: BIRAFFE2
  path: ../dataset/data/BIRAFFE2/Version 2/BIRAFFE2-biosigs.zip
  metadata_path: ../dataset/data/BIRAFFE2/Version 2/BIRAFFE2-metadata.csv
  procedure_path: ../dataset/data/BIRAFFE2/Version 2/BIRAFFE2-procedure.zip
  face_zip_path: ../dataset/data/BIRAFFE2/Version 2/BIRAFFE2-photo.zip
  modalities:
  - ECG
  - EDA
  - FACE
  score_column:
  - GEQ-1-FLOW-2018
  - GEQ-2-FLOW-2018
  - GEQ-3-FLOW-2018
  treat_levels_as_subjects: true
label:
  method: extreme_percentile
  percentile_low: 0.2
  percentile_high: 0.8
  items: full_subscale
  classes:
  - low
  - high
preprocessing:
  cleaning_package: neurokit2
  z_standardise: true
  outlier_strategy: none
  baseline_correction: none
  baseline_length_s: 60
segmentation:
  window_length_s: 60
  step_s: 30
features:
  ecg:
    time:
    - hr_mean
    - SDNN
    - RMSSD
    - pNN50
    frequency:
    - VLF
    - LF
    - HF
    - LF_HF
    - TP
    nonlinear:
    - sample_entropy
    - DFA_alpha1
    - DFA_alpha2
  package: neurokit2
models:
  classical: []
  deep:
  - MLP
  - LSTM
  - CNN1D
validation:
  strategy: LOSO
  permutation: false
  metrics:
  - accuracy
  - f1_macro
  - precision_low
  - recall_low
  - precision_high
  - recall_high
  - auc
  - inference_ms
