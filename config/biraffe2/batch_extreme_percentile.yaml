# Batch config for BIRAFFE2 extreme percentile labeling (bottom 20 % vs. top 20 %).
# Run with: python scripts/run_batch_from_config.py --batch config/biraffe2/batch_extreme_percentile.yaml

batch_name: "biraffe2_extreme_percentile"
n_jobs: -1

configs:
